<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onezerozero.com</title>
<meta name="description" content="정보·컴퓨터 교육용 웹앱을 한곳에 모았습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #16181d;
    --muted: #5d6470;
    --line: #e3e6eb;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --orange: #e8590c;  --orange-bg: #fff1e6;
    --blue:   #1c7ed6;  --blue-bg:   #e7f2fd;
    --green:  #2f9e44;  --green-bg:  #e9f7ec;
    --violet: #7048e8;  --violet-bg: #f0ebff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --surface: #1a1d23;
      --text: #eceef2;
      --muted: #9aa2ae;
      --line: #2a2e36;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --orange: #ff922b; --orange-bg: #3a2414;
      --blue:   #4dabf7; --blue-bg:   #13283b;
      --green:  #51cf66; --green-bg:  #16301c;
      --violet: #9775fa; --violet-bg: #251d3d;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    word-break: keep-all;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { padding: 56px 0 28px; }
  .brand { display: flex; align-items: center; gap: 18px; margin: 0 0 14px; }
  .brand-text { min-width: 0; }
  .brand .eyebrow { margin: 0 0 4px; }
  .brand h1 { margin: 0; }
  .avatar {
    flex: none; width: 84px; height: 84px; border-radius: 50%; object-fit: cover; display: block;
    border: 2px solid var(--surface); box-shadow: var(--shadow), 0 0 0 1px var(--line);
  }
  @media (max-width: 480px) { .avatar { width: 64px; height: 64px; } .brand { gap: 12px; } }
  .eyebrow { font-size: 14px; font-weight: 700; color: var(--orange); letter-spacing: .02em; margin: 0 0 8px; }
  h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 900; line-height: 1.2; margin: 0 0 12px; letter-spacing: -.02em; }
  .lead { color: var(--muted); font-size: 16px; margin: 0; max-width: 40em; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 28px 0 8px; }
  .search {
    flex: 1 1 240px; min-width: 0;
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; outline: none;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  section { margin: 36px 0; }
  section[hidden] { display: none; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
  .sec-head h2 { font-size: 20px; margin: 0; }
  .sec-head span { color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .card {
    --c: var(--blue); --cb: var(--blue-bg);
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
  .card[hidden] { display: none; }
  .card.orange { --c: var(--orange); --cb: var(--orange-bg); }
  .card.green  { --c: var(--green);  --cb: var(--green-bg); }
  .card.violet { --c: var(--violet); --cb: var(--violet-bg); }

  .icon {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--cb); font-size: 22px; margin-bottom: 14px;
  }
  .card h4 { font-size: 17px; margin: 0 0 6px; line-height: 1.35; }
  .card p { font-size: 14px; color: var(--muted); margin: 0 0 16px; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: 12px; font-weight: 500; color: var(--c); background: var(--cb); border-radius: 6px; padding: 2px 8px; }
  .go { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--c); white-space: nowrap; }
  .code {
    position: absolute; top: 18px; right: 18px; font-size: 12px; color: var(--muted);
    text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
  }
  .code:hover { color: var(--text); border-color: var(--muted); }

  .group { margin: 44px 0; }
  .group[hidden] { display: none; }
  .group-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid var(--text); margin-bottom: 4px; }
  .group-head h2 { font-size: 24px; font-weight: 900; margin: 0; letter-spacing: -.01em; }
  .group-head span { color: var(--muted); font-size: 14px; }
  .group section { margin: 24px 0 32px; }
  .sec-head h3 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .sec-head h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }

  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin: 12px 0 8px; }
  @media (max-width: 420px) { .home-grid { grid-template-columns: 1fr; } }
  .tile {
    --c: var(--blue); --cb: var(--blue-bg);
    display: flex; flex-direction: column; min-height: 240px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px; box-shadow: var(--shadow); color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:hover, .tile:focus-visible { transform: translateY(-3px); border-color: var(--c); outline: none; }
  .tile.violet { --c: var(--violet); --cb: var(--violet-bg); }
  .tile.green  { --c: var(--green);  --cb: var(--green-bg); }
  .tile .icon { width: 56px; height: 56px; font-size: 28px; border-radius: 14px; margin-bottom: 18px; }
  .tile h2 { font-size: 26px; font-weight: 900; margin: 0 0 6px; letter-spacing: -.01em; }
  .tile p { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  .tile .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; flex: 1; align-content: flex-start; }
  .tile .subs span { font-size: 13px; font-weight: 500; color: var(--c); background: var(--cb); border-radius: 6px; padding: 3px 10px; }
  .tile .go { margin-left: 0; font-size: 15px; }
  .tile .count { color: var(--muted); font-size: 14px; font-weight: 500; }
  .tile .bottom { display: flex; justify-content: space-between; align-items: center; }

  .back {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    text-decoration: none; display: inline-block; margin-bottom: 18px;
  }
  .back:hover { color: var(--text); border-color: var(--muted); }
  #view .toolbar { margin: 16px 0 0; }
  [hidden] { display: none !important; }

  /* 웹앱 보기 / 단원 보기 */
  .tabs { display: flex; gap: 6px; margin: 18px 0 0; }
  .tabs a { font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; }
  .tabs a[aria-current="page"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* 단원 목록 카드 */
  .unit-card .stats { display: flex; flex-wrap: wrap; gap: 6px; }

  /* 단원 페이지 */
  .unit { margin-top: 24px; }
  .unit-title { display: flex; align-items: center; gap: 14px; margin: 0 0 6px; }
  .unit-title .icon { margin: 0; flex: none; }
  .unit-title h2 { font-size: clamp(22px, 4vw, 28px); font-weight: 900; margin: 0; letter-spacing: -.01em; }
  .unit-summary { color: var(--muted); margin: 0 0 8px; }
  .draft-note { font-size: 14px; color: var(--orange); background: var(--orange-bg); border-radius: 10px; padding: 10px 14px; margin: 16px 0 0; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; margin: 18px 0; }
  .block > h3 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  .block > h3 .num { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-bg); flex: none; }
  .block ul { margin: 0; padding-left: 1.2em; }
  .block li + li { margin-top: 4px; }
  .std { display: flex; gap: 12px; align-items: baseline; }
  .std + .std { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .std code { font-family: inherit; font-weight: 700; color: var(--blue); white-space: nowrap; }
  @media (max-width: 520px) { .std { flex-direction: column; gap: 2px; } }
  .analysis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .analysis > div { border-radius: 10px; padding: 14px 16px; background: var(--bg); }
  .analysis h4 { font-size: 15px; margin: 0 0 4px; }
  .analysis .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .analysis ul { font-size: 15px; }
  .focus { margin: 0; padding-left: 1.2em; }
  .focus li { font-size: 15px; }
  .flow { list-style: none; padding: 0; margin: 0; }
  .flow li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 10px 0; }
  .flow li + li { border-top: 1px solid var(--line); margin: 0; }
  .flow .step { font-size: 13px; font-weight: 700; color: var(--blue); background: var(--blue-bg); border-radius: 6px; padding: 2px 8px; }
  .flow .what { flex: 1 1 220px; }
  .flow .links { display: flex; gap: 6px; }
  .flow .links a { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; text-decoration: none; }
  .flow .links a:hover { color: var(--text); border-color: var(--muted); }
  .todo { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px 16px; color: var(--muted); font-size: 14px; }
  .todo code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .ws-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .ws { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .ws h4 { font-size: 16px; margin: 0; }
  .ws p { font-size: 14px; color: var(--muted); margin: 0; flex: 1; }
  .ws .btns { display: flex; gap: 6px; margin-top: 6px; }
  .ws .btns a { font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 8px; padding: 6px 12px;
    color: var(--blue); background: var(--blue-bg); }
  .block .grid { margin-top: 4px; }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { color: var(--muted); font-size: 13px; padding: 24px 0 48px; border-top: 1px solid var(--line); margin-top: 48px; }
  footer a { color: inherit; }
  footer p { margin: 0; }
  footer .copy { margin-top: 6px; }
</style>
</head>

    desc: "SDGs에서 주제를 골라 문제 정의, 데이터 수집, 탐색적 분석, 회귀 분석, 일반화·공유까지 직접 기록하고 AI 코치의 피드백을 받습니다.",
    tags: ["프로젝트", "SDGs", "탐색적 분석", "AI 코치"] },
  { sec: "teacher", repo: "class-participation", icon: "🙋",
    title: "실시간 수업 참여 도구",
    desc: "수업 중 도움 요청 대기열, 이해도 체크, 퀴즈, 짧은 답 질문을 학생과 실시간으로 주고받습니다.",
    tags: ["교사용", "실시간"] },
  { sec: "teacher", repo: "observation-notes", icon: "📝",
    title: "학생 관찰 기록 (모바일 전용)",
    desc: "수업 중 학생 관찰을 기록하고 학기말 세특 작성에 활용하는 교사용 웹앱입니다.",
    tags: ["교사용", "세특"] },
];

const list = document.getElementById("list");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const COLOR_VAR = { blue: "--blue", orange: "--orange", green: "--green", violet: "--violet" };
const renderSection = s => {
  const apps = APPS.filter(a => a.sec === s.key);
  const head = s.title
    ? `<div class="sec-head"><h3 style="--dot: var(${COLOR_VAR[s.color]})">${s.title}</h3><span>${s.note} · ${apps.length}개</span></div>`
    : "";
  return `<section data-sec="${s.key}">
    ${head}
    <div class="grid">${apps.map(a => renderCard(a, s.color)).join("")}
    </div>
  </section>`;
};
const appUrl = a => a.url || GH + a.repo + "/";
const renderCard = (a, color) => `
      <a class="card ${color}" href="${appUrl(a)}" data-repo="${a.repo}" target="_blank" rel="noopener"
         data-text="${esc((a.title + " " + a.desc + " " + a.tags.join(" ") + " " + a.repo).toLowerCase())}">
        <div class="icon" aria-hidden="true">${a.icon}</div>
        <h4>${esc(a.title)}</h4>
        <p>${esc(a.desc)}</p>
        <div class="meta">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span class="go">열기 →</span></div>
      </a>`;
const secColor = a => (SECTIONS.find(s => s.key === a.sec) || {}).color || "blue";

const home = document.getElementById("home");
const view = document.getElementById("view");
const sectionsEl = document.getElementById("sections");
const q = document.getElementById("q");
const appsOf = g => APPS.filter(a => SECTIONS.some(s => s.group === g.key && s.key === a.sec));

// 첫 화면: 큰 상자 두 개
home.innerHTML = GROUPS.map(g => {
  const subs = SECTIONS.filter(s => s.group === g.key && s.title);
  return `<a class="tile ${g.color}" href="#${g.key}">
    <div class="icon" aria-hidden="true">${g.icon}</div>
    <h2>${g.title}</h2>
    <p>${g.note}</p>
    <div class="subs">${subs.map(s => `<span>${s.title} ${APPS.filter(a => a.sec === s.key).length}</span>`).join("")}</div>
    <div class="bottom"><span class="count">웹앱 ${appsOf(g).length}개</span><span class="go">들어가기 →</span></div>
  </a>`;
}).join("");

function addCodeLinks(root) {
  root.querySelectorAll(".card[data-repo]").forEach(card => {
    const repo = card.dataset.repo;
    const code = document.createElement("span");
    code.className = "code"; code.textContent = "코드"; code.setAttribute("role", "link"); code.tabIndex = 0;
    const open = e => { e.preventDefault(); e.stopPropagation(); window.open(REPO + repo, "_blank", "noopener"); };
    code.addEventListener("click", open);
    code.addEventListener("keydown", e => { if (e.key === "Enter") open(e); });
    card.appendChild(code);
  });
}

// ── 단원 ──────────────────────────────
const unitsEl = document.getElementById("units");
const tabsEl = document.getElementById("tabs");
const toolbarEl = document.getElementById("toolbar");
const unitApps = u => APPS.filter(a => (a.units || []).includes(u.key));
const todo = (what, field) =>
  `<div class="todo">아직 비어 있습니다. <code>units.js</code>의 <code>${field}</code>에 ${what} 내용을 적어 주세요.</div>`;
const items = list => `<ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

function renderUnitList(g) {
  const units = UNITS.filter(u => u.group === g.key);
  return `<div class="grid" style="margin-top:24px">${units.map(u => `
    <a class="card ${u.color} unit-card" href="#${g.key}/unit/${u.key}">
      <div class="icon" aria-hidden="true">${u.icon}</div>
      <h4>${esc(u.title)}</h4>
      <p>${esc(u.summary)}</p>
      <div class="meta">
        <span class="tag">성취기준 ${u.standards.length}</span>
        <span class="tag">웹앱 ${unitApps(u).length}</span>
        <span class="tag">학습지 ${u.worksheets.length}</span>
        <span class="go">보기 →</span>
      </div>
    </a>`).join("")}
  </div>`;
}

function renderUnit(g, u) {
  const n = (i, t) => `<h3><span class="num">${i}</span>${t}</h3>`;
  const col = (title, hint, list, field) => list ? `<div>
      <h4>${title}</h4><p class="hint">${hint}</p>
      ${list.length ? items(list) : todo(title, field)}
    </div>` : "";
  const apps = unitApps(u);
  const flowLinks = f => {
    const a = APPS.find(x => x.repo === f.app);
    const w = f.worksheet != null ? u.worksheets[f.worksheet] : null;
    return [a && `<a href="${appUrl(a)}" target="_blank" rel="noopener">${a.icon} 웹앱</a>`,
            w && w.pdf && `<a href="${w.pdf}" target="_blank" rel="noopener">📄 학습지</a>`].filter(Boolean).join("");
  };
  return `<a class="back" href="#${g.key}">← 단원 목록</a>
  <article class="unit">
    <div class="unit-title"><div class="icon" aria-hidden="true">${u.icon}</div><h2>${esc(u.title)}</h2></div>
    <p class="unit-summary">${esc(u.summary)}</p>
    ${u.draft ? `<p class="draft-note">시안입니다. 지식·이해, 과정·기능, 수업 주안점, 수업 흐름은 학습지에서 읽어 낸 초안이니 확인해 주세요.</p>` : ""}

    <section class="block">${n(1, "성취기준")}
      ${u.standards.length
        ? u.standards.map(s => `<div class="std"><code>${esc(s.code)}</code><span>${esc(s.text)}</span></div>`).join("")
        : todo("성취기준", "standards")}
    </section>

    <section class="block">${n(2, "성취기준 분석")}
      <div class="analysis">
        ${col("지식·이해", "무엇을 알아야 하나", u.knowledge, "knowledge")}
        ${col("과정·기능", "무엇을 할 수 있어야 하나", u.skills, "skills")}
        ${col("가치·태도", "어떤 태도를 기르나", u.values, "values")}
      </div>
    </section>

    <section class="block">${n(3, "수업 주안점")}
      ${u.focus.length ? `<ul class="focus">${u.focus.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : todo("수업 주안점", "focus")}
    </section>

    <section class="block">${n(4, "수업 흐름")}
      ${u.flow.length ? `<ol class="flow">${u.flow.map(f => `<li>
          <span class="step">${esc(f.step)}</span><span class="what">${esc(f.title)}</span>
          <span class="links">${flowLinks(f)}</span></li>`).join("")}</ol>` : todo("수업 흐름", "flow")}
    </section>

    <section class="block">${n(5, "수업 자료")}
      <h4 style="margin:0 0 10px">학습지</h4>
      ${u.worksheets.length ? `<div class="ws-list">${u.worksheets.map(w => `<div class="ws">
          <h4>📄 ${esc(w.title)}</h4><p>${esc(w.note || "")}</p>
          <div class="btns">${w.pdf ? `<a href="${w.pdf}" target="_blank" rel="noopener">PDF 보기</a>` : ""}${w.hwpx ? `<a href="${w.hwpx}" download>hwpx 내려받기</a>` : ""}</div>
        </div>`).join("")}</div>` : todo("학습지", "worksheets")}
      <h4 style="margin:22px 0 10px">웹앱</h4>
      <div class="grid">${apps.map(a => renderCard(a, secColor(a))).join("")}</div>
    </section>
  </article>`;
}

// 그룹 안 화면  (#ds 단원 목록 · #ds/apps 웹앱 목록 · #ds/unit/regression 단원 페이지)
function route() {
  const [gk, mode, uk] = location.hash.slice(1).split("/");
  const g = GROUPS.find(x => x.key === gk);
  home.hidden = !!g; view.hidden = !g;
  document.querySelector(".lead").hidden = !!g;
  if (!g) { document.title = "onezerozero.com"; return; }
  const hasUnits = UNITS.some(x => x.group === g.key);
  const u = mode === "unit" && UNITS.find(x => x.group === g.key && x.key === uk);
  // 단원이 있는 그룹은 단원 보기가 첫 화면 (#ds), 웹앱 보기는 #ds/apps
  const unitMode = hasUnits && mode !== "apps";
  document.title = `${u ? u.title + " · " : ""}${g.title} · onezerozero.com`;

  const secs = SECTIONS.filter(s => s.group === g.key);
  document.getElementById("list").innerHTML =
    `<div class="group-head"><h2>${g.icon} ${g.title}</h2><span>${g.note} · ${appsOf(g).length}개</span></div>`;

  tabsEl.hidden = !hasUnits || !!u;
  tabsEl.innerHTML = `<a href="#${g.key}"${unitMode ? ' aria-current="page"' : ""}>단원 보기</a>
    <a href="#${g.key}/apps"${unitMode ? "" : ' aria-current="page"'}>웹앱 보기</a>`;

  toolbarEl.hidden = sectionsEl.hidden = unitMode;
  unitsEl.hidden = !unitMode;
  if (unitMode) {
    document.getElementById("empty").hidden = true;
    unitsEl.innerHTML = u ? renderUnit(g, u) : renderUnitList(g);
    addCodeLinks(unitsEl);
  } else {
    sectionsEl.innerHTML = secs.map(renderSection).join("");
    addCodeLinks(sectionsEl);
    q.value = ""; apply();
  }
  window.scrollTo(0, 0);
}

function apply() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  sectionsEl.querySelectorAll("section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".card").forEach(c => {
      const ok = !term || c.dataset.text.includes(term);
      c.hidden = !ok; if (ok) n++;
    });
    sec.hidden = n === 0; shown += n;
  });
  document.getElementById("empty").hidden = shown > 0;
}
q.addEventListener("input", apply);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
